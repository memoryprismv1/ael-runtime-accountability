name: Runtime tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Keep ordinary CI for main and other branches, but don't spam notifications
    # while the isolated skill-microprobe branch is being iterated on.
    if: github.ref_name != 'test/ct-skill-microprobe' && github.event.pull_request.head.ref != 'test/ct-skill-microprobe'
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile runtime and tests
        run: python -m compileall -q runtime.py ael_chat.py tests experiments
      - name: Run existing unit and mock integration tests
        run: python -m unittest discover -s tests -v
      - name: Run experiment logging and paired-run contract tests
        run: python -m unittest experiments.ct_ab.test_logging experiments.ct_ab.test_pair_runner -v
      - name: Run CT skill microprobe unit tests
        run: python -m unittest experiments.ct_ab.test_microprobe -v
      - name: Run synthetic pair preflight
        run: python -m experiments.ct_ab.preflight --output "$RUNNER_TEMP/ct-ab-preflight"
      - name: Upload synthetic preflight logs and report
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-ab-instrumentation-preflight
          path: ${{ runner.temp }}/ct-ab-preflight/
          if-no-files-found: warn
          retention-days: 30
