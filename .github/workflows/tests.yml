name: Runtime and experiment comparison tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Python ${{ matrix.python-version }} — baseline vs CT
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile both trees
        run: python -m compileall -q ael_environment.py run_ael.py compare_environments.py runtime.py ael_chat.py tests ct/runtime.py ct/ael_chat.py ct/ael_environment.py ct/ael_task_precommitment.py ct/tests
      - name: Run and compare baseline and CT test suites
        run: python compare_environments.py --out comparison-report-${{ matrix.python-version }}.json
      - name: Preserve comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report-python-${{ matrix.python-version }}
          path: comparison-report-${{ matrix.python-version }}.json
          if-no-files-found: ignore
