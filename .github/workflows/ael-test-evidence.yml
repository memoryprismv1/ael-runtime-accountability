name: AEL unit-test evidence

on:
  push:
    branches:
      - test/capture-unit-test-evidence
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests and collect evidence
        run: python scripts/run_test_evidence.py
      - name: Upload raw log and structured evidence even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ael-unit-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-evidence/unit-test-run.log
            test-evidence/unit-test-evidence.json
          if-no-files-found: warn
          retention-days: 90
